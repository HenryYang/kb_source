name: Build Hugo and Deploy
on:
  push:
    branches:
      - master
jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # enableGitInfo 需要完整 history 才能取到每個檔案真正的最後修改時間。
          # 預設的 fetch-depth: 1 會讓所有頁面的 Last modified 都變成最後一次 commit 的時間。
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.165.0'
          extended: true
          
      - name: Build
        run: hugo
        
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: HenryYang/kb 
          publish_dir: ./public 
          publish_branch: master
          cname: kb.hiy.tw
